name: Build

# Test the core crate, build the release exe, start it once as a smoke test, and upload
# SafeToolbox.exe as an artifact. release.yml reuses this.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "The tag being released, for example v2.0.0. It must match the version in Cargo.toml."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        if: inputs.version != ''
        shell: pwsh
        env:
          TAG: ${{ inputs.version }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("$env:TAG".TrimStart('v') -ne $v) { throw "Tag $env:TAG doesn't match version $v in Cargo.toml" }

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test -p toolbox-core

      - name: Build (one exe, win-x64)
        shell: pwsh
        run: |
          cargo build --release -p safe-toolbox
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item target/release/safe-toolbox.exe publish/SafeToolbox.exe
          "{0:N1} MB" -f ((Get-Item publish/SafeToolbox.exe).Length / 1MB)

      - name: Smoke test (start the app, check it stays up and logs no error)
        shell: pwsh
        run: |
          $exe = Resolve-Path publish/SafeToolbox.exe
          $errLog = Join-Path $env:LOCALAPPDATA "SafeToolbox\error.log"
          Remove-Item $errLog -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 30
          $p.Refresh()
          if ($p.HasExited) { Write-Host "::error::The app exited after start with code $($p.ExitCode)"; exit 1 }
          Write-Host "Running after 30 s. Title: '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force
          if (Test-Path $errLog) { Write-Host "::error::The app wrote error.log:"; Get-Content $errLog; exit 1 }

      - name: Upload SafeToolbox.exe
        uses: actions/upload-artifact@v7
        with:
          name: SafeToolbox-win-x64
          path: publish/SafeToolbox.exe
          if-no-files-found: error
